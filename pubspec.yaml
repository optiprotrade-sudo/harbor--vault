name: harbor_vault
description: Personal, self-custodial, multi-chain wallet prototype with safe send review.
publish_to: none
version: 1.0.0+10

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  bip39_mnemonic: ^4.1.0
  bip32_keys: ^3.1.4
  bech32: ^0.2.2
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  web3dart: ^3.0.3
  flutter_secure_storage: ^11.2.0
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  http: ^1.3.0
  solana_sdk: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
